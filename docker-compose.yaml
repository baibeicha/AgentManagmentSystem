version: '3.8'

services:
  postgres_meta:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescale
    environment:
      POSTGRES_USER: ${TIMESCALE_USER}
      POSTGRES_PASSWORD: ${TIMESCALE_PASS}
      POSTGRES_DB: ${TIMESCALE_DB}
    ports:
      - "5433:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-init:
    image: bitnami/kafka:3.6
    container_name: kafka_init
    depends_on:
      - kafka
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...' &&
        sleep 10 &&
        kafka-topics.sh --create --if-not-exists --topic telemetry_events --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 &&
        echo 'Topic telemetry_events created.'
      "

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth
    container_name: auth
    ports:
      - "8081:8081"
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASS}@postgres_meta:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSL:false}
      REDIS_ADDR: ${REDIS_ADDR}
    depends_on:
      postgres_meta:
        condition: service_healthy

  ingestion-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: gateway
    container_name: gateway
    ports:
      - "443:443"
      - "8082:8082"
    environment:
      KAFKA_BROKERS: ${KAFKA_ADDR}
      REDIS_ADDR: ${REDIS_ADDR}
    depends_on:
      - kafka
      - redis

  processor-service:
    build:
      context: .
      args:
        SERVICE_NAME: processor
    container_name: processor
    environment:
      KAFKA_BROKERS: ${KAFKA_ADDR}
      TIMESCALEDB_DSN: postgres://${TIMESCALE_USER}:${TIMESCALE_PASS}@timescaledb:5432/${TIMESCALE_DB}?sslmode=${TIMESCALE_SSL:false}
    depends_on:
      - kafka
      - timescaledb

volumes:
  pg_meta_data:
  tsdb_data:
  redis_data:
  kafka_data: