syntax = "proto3";

package api.grpc.auth.v1;

option go_package = "pkg/";

// AuthService предоставляет методы для аутентификации и выдачи токенов
service AuthService {
  // Метод логина для получения Access и Refresh токенов
  rpc Login(LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  string login = 1;
  string password = 2;
  string device_id = 3;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}