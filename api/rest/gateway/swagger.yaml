  # --- HEALTH DOMAIN ---
  /healthz:
    get:
      tags:
        - Health Probes
      summary: Application Liveness check
      responses:
        '200':
          description: Application routing operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
  /readyz:
    get:
      tags:
        - Health Probes
      summary: Application Readiness dependencies verify
      description: Verifies active connectivity to PostgreSQL, Redis cluster, and Kafka broker streams.
      responses:
        '200':
          description: Gateway dependencies online
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  components:
                    type: object
                    properties:
                      database:
                        type: string
                        example: connected
                      redis:
                        type: string
                        example: connected
                      kafka:
                        type: string
                        example: connected
        '503':
          description: Downstream connection broken

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Device:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        alias:
          type: string
          example: main-k8s-node-01
        os:
          type: string
          example: linux
        arch:
          type: string
          example: amd64
        ip_address:
          type: string
          example: 192.168.1.50
        status:
          type: string
          enum: [online, offline]
          example: online
        agent_version:
          type: string
          example: v1.2.0
        group_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
          example: ["k8s", "prod"]
        last_heartbeat:
          type: string
          format: date-time
    ScriptTemplate:
      type: object
      required:
        - name
        - content
        - interpreter
      properties:
        script_id:
          type: string
          format: uuid
        name:
          type: string
          example: "clean_docker_cache.sh"
        description:
          type: string
        content:
          type: string
          example: "#!/bin/bash\ndocker system prune -af"
        interpreter:
          type: string
          enum: [bash, sh, powershell, cmd]
          example: bash
    AlertRule:
      type: object
      required:
        - metric
        - operator
        - threshold
        - duration
      properties:
        rule_id:
          type: string
          format: uuid
        name:
          type: string
          example: "High CPU Usage Alert"
        metric:
          type: string
          enum: [cpu, ram, disk, network]
          example: cpu
        operator:
          type: string
          enum: [">", "<", "==", ">="]
          example: ">"
        threshold:
          type: number
          example: 90.0
        duration:
          type: string
          example: 5m
        playbook_id:
          type: string
          format: uuid
          nullable: true
    NotificationChannel:
      type: object
      required:
        - name
        - type
        - destination
      properties:
        channel_id:
          type: string
          format: uuid
        name:
          type: string
          example: "DevOps Core Telegram Bot Chat"
        type:
          type: string
          enum: [telegram, discord, webhook]
          example: telegram
        destination:
          type: string
          example: "https://api.telegram.org/bot723491823/sendMessage?chat_id=-100123456"
        is_active:
          type: boolean
          example: true
    Incident:
      type: object
      properties:
        incident_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        type:
          type: string
          example: "DEAD_MAN_SWITCH_TRIGGERED"
        severity:
          type: string
          enum: [info, warning, critical]
          example: critical
        status:
          type: string
          enum: [OPEN, ACKNOWLEDGED, RESOLVED]
          example: OPEN
        created_at:
          type: string
          format: date-time
